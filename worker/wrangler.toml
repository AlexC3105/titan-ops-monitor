name = "titan-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# No secrets are required: OpenSky's public endpoint is used anonymously.
[vars]
# Browser origins allowed to call the API. Local Vite dev + preview only for now;
# the production PWA origin is added when the frontend is deployed (T5).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
